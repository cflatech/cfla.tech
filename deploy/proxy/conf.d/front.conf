server {
    listen 80;
    listen [::]:80;
    server_name www.cfla.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/acme/webroot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.cfla.tech;

    ssl_certificate /etc/acme/data/certificates/www.cfla.tech.crt;
    ssl_certificate_key /etc/acme/data/certificates/www.cfla.tech.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /api/v1/public/site {
        resolver 127.0.0.11 valid=30s;
        set $api_public_upstream api-public:8787;
        proxy_pass http://$api_public_upstream/api/v1/public/site;
        proxy_set_header Host $host;
    }

    location /api/ {
        return 404;
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        set $front_upstream front:80;
        proxy_pass http://$front_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
