server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/acme/webroot;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
