services:
  proxy:
    build:
      context: .
      dockerfile: ./deploy/proxy/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - acme:/etc/acme
    depends_on:
      - front
      - api-public
    networks:
      - default
      - api_public

  front:
    build:
      context: .
      dockerfile: ./deploy/front/Dockerfile
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: ./deploy/app/Dockerfile
    restart: unless-stopped
    environment:
      PRIVATE_API_URL: http://api-private:8788
    depends_on:
      - api-private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/healthz').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app_internal
      - api_private

  api-public:
    build:
      context: .
      dockerfile: ./deploy/api/Dockerfile
    restart: unless-stopped
    networks:
      - api_public

  api-private:
    build:
      context: .
      dockerfile: ./deploy/api/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/private-server.js"]
    env_file:
      - path: .env.access
        required: false
    networks:
      - api_private
      - api_private_egress

  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_DISABLE_PATH_NORMALIZATION: "false"
    env_file:
      - .env.cloudflared
    networks:
      - app_internal
      - tunnel_egress
    depends_on:
      app:
        condition: service_healthy

  lego:
    build:
      context: .
      dockerfile: ./deploy/lego/Dockerfile
    restart: unless-stopped
    volumes:
      - acme:/etc/acme
    environment:
      FRONTEND_DOMAIN: www.cfla.tech
    env_file:
      - .env.lego
    depends_on:
      - proxy

volumes:
  acme:

networks:
  api_public:
    internal: true
  api_private:
    internal: true
  api_private_egress:
  app_internal:
    internal: true
  tunnel_egress:
