services:
  proxy:
    build:
      context: .
      dockerfile: ./deploy/proxy/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - acme:/etc/acme
    depends_on:
      - front

  front:
    build:
      context: .
      dockerfile: ./deploy/front/Dockerfile
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: ./deploy/app/Dockerfile
    restart: unless-stopped
    networks:
      - app_internal

  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_DISABLE_PATH_NORMALIZATION: "false"
    env_file:
      - .env.cloudflared
    networks:
      - app_internal
      - tunnel_egress
    depends_on:
      - app

  lego:
    build:
      context: .
      dockerfile: ./deploy/lego/Dockerfile
    restart: unless-stopped
    volumes:
      - acme:/etc/acme
    environment:
      FRONTEND_DOMAIN: www.cfla.tech
    env_file:
      - .env.lego
    depends_on:
      - proxy

volumes:
  acme:

networks:
  app_internal:
    internal: true
  tunnel_egress:
